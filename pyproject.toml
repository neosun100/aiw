[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiw"
version = "0.1.0"
description = "AI Workspace Manager - 管理多个 AI Agent 工作空间"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "toml>=0.10",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=11.0",
    "mcp>=1.0.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
]

[project.scripts]
aiw = "aiw.cli:cli"
aiw-mcp = "aiw.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
